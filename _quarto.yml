project:
  type: book
  output-dir: _book
  execute-dir: project
  render:
    - index.qmd
  pre-render: scripts/quarto/pre-render.R
  resources:
    - resultados/python_recalculado/figuras/
    - informe/Informe_Cobb_Douglas_Guanajuato_final.html

book:
  title: "Relación entre capital, trabajo y valor agregado en la industria manufacturera de Guanajuato"
  date: "2026-11-12"
  chapters:
    - index.qmd
  page-navigation: false
  search: false
  repo-actions: none

lang: es

execute:
  freeze: false

format:
  html:
    theme: none
    css:
      - assets/css/referencia-html.css
      - assets/css/quarto-book-compat.css
    toc: false
    number-sections: false
    embed-resources: true
    page-layout: full
    smooth-scroll: false
    code-tools: false
    anchor-sections: false
    title-block-banner: false
    link-external-newwindow: false
